<!DOCTYPE html>
<html>

<head>
    <script src="js/aframe.min.js"></script>
    <script src="js/zappar-aframe/zappar-aframe.js"></script>
    <script src="js/aframe-extras.min.js"></script>

    <meta charset="utf-8" />
    <title>Zappar for A-Frame: Face Tracking 3D Model Example</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <a-scene>
        <!-- Ask user for camera permissions, display some text if permission is denied -->
        <a-entity zappar-permissions-ui id="permissions"></a-entity>
        <!-- shows a full-page dialog that informs the user they're using an unsupported browser -->
        <a-entity zappar-compatibility-ui id="compatibility"></a-entity>

        <a-camera zappar-camera="user-facing: true;" />

        <!-- Setup our face tracker -->
        <a-entity zappar-face id="my-face-tracker">

            <!-- Include a head mask object that will make sure the user's head appears in the center of our helmet -->
            <a-entity zappar-head-mask="face:#my-face-tracker;"></a-entity>

            <!-- Маска 1: 3D-модель -->
            <a-entity id="mask1" gltf-model="url(mask.glb)" position="0 0 1" scale="0.5 0.5 0.5" visible="true"></a-entity>

            <!-- Маска 2: текстура на сетке лица -->
            <a-entity id="mask2" geometry="primitive: face-mesh; face: #my-face-tracker" material="src:url(faceMeshTemplate(2).png); transparent: true;" visible="false"></a-entity>

            <!-- Маска 3: анимированная модель -->
            <a-entity id="mask3" rotation="0 0 0" gltf-model="url(maskanim.glb)" scale="0.5 0.5 0.5" position="0 0.1 0.6" animation-mixer="clip: *" visible="false"></a-entity>

        </a-entity>
    </a-scene>

    <!-- Кнопки переключения масок -->
    <div style="position: fixed; bottom: 20px; left: 0; width: 100%; display: flex; justify-content: center; gap: 12px; z-index: 999;">
        <button onclick="switchMask(1)">Маска 1</button>
        <button onclick="switchMask(2)">Маска 2</button>
        <button onclick="switchMask(3)">Маска 3</button>
    </div>

    <script>
        function switchMask(num) {
            for (let i = 1; i <= 3; i++) {
                document.getElementById('mask' + i).setAttribute('visible', i === num);
            }
        }
    </script>
</body>

</html>
